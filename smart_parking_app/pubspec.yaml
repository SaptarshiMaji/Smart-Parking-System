name: smart_parking_app

description: Smart Parking Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP API
  http: ^1.2.1

  # Fonts
  google_fonts: ^6.2.1

  # Bottom Navigation
  google_nav_bar: ^5.0.6

  # QR Generator
  qr_flutter: ^4.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Animations
  lottie: ^3.1.0

  # Icons
  font_awesome_flutter: ^10.7.0

  # Maps Navigation
  url_launcher: ^6.3.0

  # Razorpay Payment
  razorpay_flutter: ^1.3.7

  # State Management
  provider: ^6.1.2

  # Geolocation
  geolocator: ^11.0.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/images/